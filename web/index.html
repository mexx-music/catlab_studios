<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CatLab Studios is an independent software studio building practical, creative and AI-powered applications across mobile, web and desktop — and staging real products in programmed films and interactive product experiences.">
  <meta name="theme-color" content="#0D0F1E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CatLab Studios">
  <!--
    iOS caches the home-screen icon at the moment the site is added and never
    refreshes it, so this points at a NEW filename rather than the old
    icons/Icon-192.png. A new path is the only reliable way to invalidate an
    already-cached home-screen icon; existing entries still need re-adding.
    Declared at 180x180, the size iOS actually wants for the home screen.
  -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Favicon — ?v=2 busts the cached Flutter default at the same filename -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>

  <title>CatLab Studios</title>
  <link rel="manifest" href="manifest.json?v=2">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
