# Builds the Flutter web app and deploys it to GitHub Pages.
# AI-hint: Update --base-href below to match your GitHub repo name.
#   Format: /<repo-name>/
#   Leave as / only if you use a custom domain (CNAME).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Required permissions for the Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; never cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true  # caches the SDK between runs

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        run: |
          flutter build web \
            --release \
            --base-href /catlab_studios/
        # AI-hint: Change /catlab_studios/ to /<your-github-repo-name>/
        # If you point a custom domain at Pages, use --base-href / instead.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web   # the folder produced by flutter build web

  # ── 2. Deploy ─────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
