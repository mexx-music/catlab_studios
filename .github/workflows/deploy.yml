# Builds the Flutter web app and deploys it to GitHub Pages.
#
# The site is served from the apex custom domain https://catlabstudios.com,
# so the app lives at the root and --base-href must stay "/". It is NOT
# "/catlab_studios/" any more: that was for the old project-path URL
# https://mexx-music.github.io/catlab_studios/, and reintroducing it would
# make every asset request 404 on the custom domain.
#
# The domain itself is pinned two ways: the Pages setting on this repo, and
# web/CNAME, which is copied into build/web and ships inside every artifact
# so a deployment can never silently drop the custom domain.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Required permissions for the Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; never cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true  # caches the SDK between runs

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        run: |
          flutter build web \
            --release \
            --base-href /

      # Cheap guard against the two ways this deployment can silently break:
      # a stale project-path base-href, or an artifact that lost the domain.
      - name: Verify root base-href and CNAME
        run: |
          grep -q '<base href="/">' build/web/index.html \
            || { echo "::error::base-href is not '/' - assets would 404 on catlabstudios.com"; exit 1; }
          ! grep -rq '/catlab_studios/' build/web/index.html build/web/manifest.json \
            || { echo "::error::build still references the old /catlab_studios/ path"; exit 1; }
          [ "$(cat build/web/CNAME)" = "catlabstudios.com" ] \
            || { echo "::error::CNAME missing from the artifact - the custom domain would be dropped"; exit 1; }
          echo "base-href, path and CNAME all correct"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web   # the folder produced by flutter build web

  # ── 2. Deploy ─────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
